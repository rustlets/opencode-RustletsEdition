name: Sovereign-Factory-V2
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  forge:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: opencode-rustlet-linux
          - os: windows-latest
            artifact_name: opencode-rustlet-windows.exe
          - os: macos-latest
            artifact_name: opencode-rustlet-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rustlet
          fetch-depth: 0

      - name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Run Sovereign Transformer
        id: transform
        shell: bash
        run: |
          echo "🔨 Running Rustlet Transformer..."
          cd .factory || mkdir -p .factory && cp -r /opt/RUSTLETS/_dataColdDev/bunScript/github-pipeline/* .factory/
          cd .factory
          REPO_PATH=$GITHUB_WORKSPACE cargo run --release
          # On exporte le changelog pour l'étape de release
          echo "CHANGELOG_PATH=$GITHUB_WORKSPACE/CHANGELOG-RUSTLET.md" >> $GITHUB_ENV

      - name: Compile Immutable Binary
        shell: bash
        run: |
          bun install
          cd packages/opencode
          # We compile the entry point that now contains our hard-coded hooks
          bun build ./src/index.ts --compile --outfile ../../${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: forge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main-rustlet' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            opencode-rustlet-linux/*
            opencode-rustlet-windows.exe/*
            opencode-rustlet-macos/*
          body: "Artifacts Immuables - OpenCode Rustlet Edition v1.0.${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
